<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4525a5">
    <title>Select Difficulty - Tic Tac Toe</title>
    <link rel="stylesheet" href="./src/styles/level.css">
</head>
<body>
    <main class="container difficulty-page">
        <a class="difficulty-back" href="./level.html">← Game modes</a>
        <header class="difficulty-heading">
            <p class="difficulty-kicker">SINGLE PLAYER</p>
            <h1>Select Difficulty</h1>
            <span class="heading-underline" aria-hidden="true"></span>
        </header>

        <nav class="difficulty-options" aria-label="Select bot difficulty">
            <a class="difficulty-option bot-easy" href="./easy.html">
                <span class="bot-avatar" aria-hidden="true">🤖</span>
                <span>Easy Bot</span>
            </a>
            <a class="difficulty-option bot-medium" href="./medium.html">
                <span class="bot-avatar" aria-hidden="true">🦾</span>
                <span>Medium Bot</span>
            </a>
            <a class="difficulty-option bot-hard" href="./hard.html">
                <span class="bot-avatar" aria-hidden="true">🥷</span>
                <span>Hard Bot</span>
            </a>
            <a class="difficulty-option bot-impossible" href="./impossible.html">
                <span class="bot-avatar" aria-hidden="true">⚡</span>
                <span>Impossible Bot</span>
            </a>
        </nav>
        <a class="difficulty-stats" href="./stats.html">📊 View player statistics</a>
    </main>
</body>
</html>
