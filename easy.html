<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Easy Level</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#11111f">
    <link rel="stylesheet" href="./src/styles/game.css">
</head>

<body>
    <script>
        function closePanel(event) {
            const target = event.target.parentElement;
            target.parentElement.style.display = 'none';
        }
    </script>

    <main class="container mode-easy">
        <header class="game-header">
            <a class="back-link" href="./level.html">← Game modes</a>
            <p class="eyebrow">EASY BOT</p>
            <h1>Tic-Tac-Toe</h1>
            <button id="restartBtn" aria-label="Restart game">↻</button>
        </header>
        <section class="players" aria-label="Players">
            <div class="player-card player-x">
                <span class="player-avatar" aria-hidden="true">X</span>
                <span class="player-name">You<small>Your mark</small></span>
                <strong class="player-mark">X</strong>
            </div>
            <span class="versus" aria-hidden="true">VS</span>
            <div class="player-card player-o">
                <span class="player-avatar" aria-hidden="true">O</span>
                <span class="player-name">Easy bot<small>Opponent</small></span>
                <strong class="player-mark">O</strong>
            </div>
        </section>
        <div id="decisionPanel">
            <div id="childPanel">
                

                <div id="message"></div>

                <button onclick="closePanel(event)">Close</button>
            </div>
        </div>

        <div class="gridParent" role="group" aria-label="Tic-tac-toe board">
            <div class="0"></div>
            <div class="1"></div>
            <div class="2"></div>
            <div class="3"></div>
            <div class="4"></div>
            <div class="5"></div>
            <div class="6"></div>
            <div class="7"></div>
            <div class="8"></div>
        </div>
    </main>

    <script src="./src/easyLevel.js" type="module"></script>

</body>
</html>
